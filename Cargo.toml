[package]
authors = ["Ian Henderson <ianhenderson@pm.me>"]
description = "A command-line program to make your mouse wander. ;)"
edition = "2021"
keywords = ["cli", "terminal", "utility", "rust", "cross-platform"]
license = "MIT"
name = "afk"
repository = "https://github.com/ian-henderson/afk.rs"
version = "0.1.11"

